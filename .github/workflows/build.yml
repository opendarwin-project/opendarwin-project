name: Rust

on:
    pull_request:
    push:
        branches:
            - main

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy

            - name: Cache cargo
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: rust/metalc -> target

            - name: Check
              run: cargo check --workspace

            - name: Test
              # Host Metal integration tests are cfg(target_os = "macos") only.
              run: cargo test --workspace

            - name: Clippy
              run: cargo clippy --workspace --all-targets
