name: Rust

on:
  pull_request:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  # GitHub-hosted macOS runners are currently on macOS 26 / AIR 2.8.
  METALC_MACOS_MAJOR: "26"
  METALC_AIR_VERSION: "2.8"

jobs:
  # TODO: also run on macos-latest once wild (https://github.com/wild-linker/wild)
  # builds/runs there too. For now this workspace's buck2 cxx toolchain
  # (toolchains/BUCK) is aarch64 Linux-specific (`-Wl,-m,aarch64linux`,
  # BLAKE3's NEON path), so everything lives in one job on an arm64 Linux
  # runner.
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bazel Environment
        uses: bazel-contrib/setup-bazel@v0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Build everything through the wild-linked toolchain
        run: |
          bazel build //...
