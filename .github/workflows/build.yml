name: Rust

on:
    pull_request:
    push:
        branches:
            - main

env:
    CARGO_TERM_COLOR: always
    # GitHub-hosted macOS runners are currently on macOS 26 / AIR 2.8.
    METALC_MACOS_MAJOR: "26"
    METALC_AIR_VERSION: "2.8"

jobs:
    test:
        runs-on: macos-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Install Rust
              uses: dtolnay/rust-toolchain@nightly
              with:
                  components: rustfmt, clippy

            - name: Install Nushell via Cargo Binstall
              uses: taiki-e/install-action@v2
              with:
                  tool: nu, cargo-nextest

            - name: Cache cargo
              uses: Swatinem/rust-cache@v2

            - name: Lint
              run: cargo xtask clippy

            - name: Run Tests
              run: cargo xtask test

            - name: Run framework tests
              run: |
                  cargo xtask framework
                  cc -isysroot $(xcrun --show-sdk-path) -arch arm64 tools/iokit_smoke.c -o /tmp/smoke -framework IOKit && DYLD_FRAMEWORK_PATH=$PWD/target/frameworks /tmp/iokit_smoke
