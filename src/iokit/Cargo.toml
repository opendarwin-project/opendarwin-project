[package]
name = "iokit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "OpenDarwin IOKit.framework userspace replacement built on raw XNU mach traps"
keywords = ["iokit", "darwin", "mach", "no-libc-syscalls"]

# Trap layer targets real macOS only: `svc #0x80` with the trap number
# negated in x16 (matches libsystem_kernel). Needed for DYLD_FRAMEWORK_PATH
# testing with real-world programs.
[features]
default = []

# The framework binary is named IOKit (libIOKit.dylib) so a `cp` into an
# `IOKit.framework/` directory yields a drop-in framework image.
[lib]
name = "IOKit"
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true
