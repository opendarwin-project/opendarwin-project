[unstable]
panic-abort-tests = true

[alias]
xtask = "run --manifest-path xtask/Cargo.toml --"

[target.aarch64-apple-darwin]
linker = "clang"
rustflags = [
    "-Clink-arg=--target=aarch64-apple-darwin",
    "-Clink-arg=-fuse-ld=mold",
    "-Zthreads=0",
    "-Zshare-generics=y",
    "-Zpolonius=next",
    "-Znext-solver=globally",
]

[target.arm64e-apple-darwin]
linker = "clang"
rustflags = [
    "-Clink-arg=--target=arm64e-apple-darwin",
    "-Clink-arg=-fuse-ld=mold",
    "-Zthreads=0",
    "-Zshare-generics=y",
    "-Zpolonius=next",
    "-Znext-solver=globally",
]
